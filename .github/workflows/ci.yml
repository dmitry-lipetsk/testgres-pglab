# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - "**/*.md"

  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - "**/*.md"

jobs:
  test-pglab:
    runs-on: ubuntu-24.04
    name: "test: pglab | ubuntu-24.04 | pg16"

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install PostgreSQL and PgLab system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          postgresql-16 \
          postgresql-client-16 \
          libpq-dev \
          iproute2 \
          iputils-ping \
          iptables \
          util-linux

    - name: Install Python test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r tests/requirements.txt

    - name: PgLab preflight
      run: |
        set -eux
        "$(pg_config --bindir)/postgres" --version
        pg_config --bindir
        findmnt -n -o SOURCE,FSTYPE -T /var/tmp
        mount | grep cgroup || true
        cat /sys/fs/cgroup/cgroup.controllers
        cat /sys/fs/cgroup/cgroup.subtree_control || true

    - name: Run privileged PgLab tests
      run: |
        set -eux
        mkdir -p "${{ github.workspace }}/logs-pglab"
        PYTHON="$(command -v python)"
        PG_BIN="$(pg_config --bindir)"
        sudo env \
          PATH="$PATH" \
          TESTGRES_PGLAB_TESTS=1 \
          PG_BIN="$PG_BIN" \
          PGLAB_OS_USER="$USER" \
          PGLAB_DB_USER=postgres \
          PGLAB_TEST_ROOT=/var/tmp \
          TEST_CFG__LOG_DIR="${{ github.workspace }}/logs-pglab" \
          "$PYTHON" -m pytest -vv -s \
            tests/test_pglab_compat.py \
            tests/test_pglab.py \
            tests/test_pglab_faults.py \
            tests/test_pglab_netem.py \
            tests/test_pglab_netem_effects.py

    - name: Upload PgLab logs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: testgres--pglab-logs--id${{ github.run_id }}
        path: logs-pglab/
