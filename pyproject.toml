[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"testgres_exts.pglab" = "src"

[tool.setuptools.dynamic]
version = {attr = "testgres_exts.pglab.__version__"}

[project]
name = "testgres_exts.pglab"
dynamic = ["version"]
description = "Linux netns/cgroup/netem fault injection for PostgreSQL tests using Testgres"
readme = "README.md"
requires-python = ">=3.8"
license = "PostgreSQL"
dependencies = [
    "testgres>=1.17,<1.18",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.flake8]
extend-ignore = ["E501"]
exclude = [".git", "__pycache__", "env", "venv"]

# Pytest settings
[tool.pytest.ini_options]
testpaths = ["tests"]
log_file_level = "NOTSET"
log_file_format = "%(levelname)8s [%(asctime)s] %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
